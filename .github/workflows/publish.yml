name: Publicar en npm

# Se dispara al subir una etiqueta de versión (por ejemplo v0.2.1):
#   npm version patch   (sube la versión en package.json y crea la etiqueta)
#   git push --follow-tags
on:
  push:
    tags: ["v*"]

jobs:
  publicar:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Trusted Publishing: npm confía en este workflow por OIDC, sin NPM_TOKEN guardado.
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci

      # Evita publicar una versión que no coincide con la etiqueta (error típico al
      # etiquetar sin haber subido la versión).
      - name: Comprobar que la etiqueta coincide con package.json
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "La etiqueta $GITHUB_REF_NAME no coincide con la versión $VERSION de package.json."
            exit 1
          fi

      # prepublishOnly corre "npm run verificar" (lint, tipos, tests y build) antes de publicar.
      - run: npm publish --provenance --access public
