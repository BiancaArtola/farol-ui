version: 2
updates:
  # Dependencias de npm: un solo PR agrupado por semana para no inundar de PRs.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    # Los majors (eslint 10, typescript 7) llegan como PR aparte para revisarlos con cuidado.
    open-pull-requests-limit: 5
  # Las acciones de GitHub Actions del CI (checkout, setup-node).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
